<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Alpha Watchdog support assistant: answers from Team Alpha's approved list.">
  <title>Alpha Watchdog · Support Assistant</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2.2l8 3v6.1c0 5-3.4 9.3-8 10.9-4.6-1.6-8-5.9-8-10.9V5.2l8-3z' fill='%230B1F3A'/%3E%3Cpath d='M6.6 12.2c1.4-2.3 3.2-3.4 5.4-3.4s4 1.1 5.4 3.4c-1.4 2.3-3.2 3.4-5.4 3.4s-4-1.1-5.4-3.4z' fill='%23fff'/%3E%3Ccircle cx='12' cy='12.2' r='1.9' fill='%232453D6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="knowledge.js" defer></script>
  <script src="engine.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#composer-input">Skip to question box</a>

  <header class="topbar">
    <div class="brand">
      <svg class="logo" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path class="logo-shield" d="M12 2.2l8 3v6.1c0 5-3.4 9.3-8 10.9-4.6-1.6-8-5.9-8-10.9V5.2l8-3z"/>
        <path class="logo-eye" d="M6.6 12.2c1.4-2.3 3.2-3.4 5.4-3.4s4 1.1 5.4 3.4c-1.4 2.3-3.2 3.4-5.4 3.4s-4-1.1-5.4-3.4z"/>
        <circle class="logo-pupil" cx="12" cy="12.2" r="1.9"/>
      </svg>
      <div class="brand-text">
        <h1 class="brand-name">Alpha Watchdog</h1>
        <p class="brand-sub">Support Assistant</p>
      </div>
    </div>

    <div class="tools">
      <button id="theme-btn" class="icon-btn" type="button" aria-label="Switch to dark theme">
        <svg class="ico" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="8"/>
          <path class="ico-fill" d="M12 4a8 8 0 0 1 0 16z"/>
        </svg>
      </button>
      <button id="download-btn" class="icon-btn desk-only" type="button" aria-label="Download transcript">
        <svg class="ico" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 4v11M7 10.5l5 5 5-5M5 19.5h14"/>
        </svg>
      </button>
      <button id="newchat-btn" class="text-btn desk-only" type="button" hidden>
        <svg class="ico" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        <span>New chat</span>
      </button>
      <div class="menu-wrap phone-only">
        <button id="more-btn" class="icon-btn" type="button" aria-label="More options" aria-haspopup="menu" aria-expanded="false" aria-controls="more-menu">
          <svg class="ico" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M6 12h.01M12 12h.01M18 12h.01"/>
          </svg>
        </button>
        <div id="more-menu" class="menu" role="menu" aria-labelledby="more-btn" hidden>
          <button id="menu-download" class="menu-item" type="button" role="menuitem" tabindex="-1">
            <svg class="ico" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 4v11M7 10.5l5 5 5-5M5 19.5h14"/>
            </svg>
            <span>Download transcript</span>
          </button>
          <button id="menu-newchat" class="menu-item" type="button" role="menuitem" tabindex="-1" hidden>
            <svg class="ico" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            <span>New chat</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <div class="notice">
    <p class="notice-pill">
      <svg class="ico" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 11v5.5M12 7.5h.01"/>
      </svg>
      <span>Demonstration only · fictional student startup</span>
    </p>
  </div>

  <main id="scroller" class="scroller">
    <section id="welcome" class="welcome" aria-labelledby="welcome-title">
      <div class="hero">
        <h2 id="welcome-title" class="hero-title">Hi, I'm the Alpha Watchdog assistant.</h2>
        <p id="welcome-text" class="hero-text">I can answer questions about how Alpha Watchdog finds hijacked smart devices on your home network. What would you like to know?</p>
      </div>
      <div id="cards" class="cards" role="group" aria-label="Suggested topics"></div>
    </section>

    <div id="thread" class="thread" role="log" aria-live="polite" aria-relevant="additions" aria-label="Conversation"></div>
  </main>

  <footer class="composer-area">
    <form id="composer" class="composer" novalidate>
      <label for="composer-input" class="sr-only">Type your question</label>
      <textarea id="composer-input" class="composer-input" rows="1" maxlength="500" placeholder="Ask about Alpha Watchdog…" autocomplete="off" enterkeyhint="send" aria-describedby="char-count"></textarea>
      <span id="char-count" class="char-count" hidden></span>
      <button id="send-btn" class="send-btn" type="submit" aria-label="Send" disabled>
        <svg class="ico ico-bold" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 19V5M6 11l6-6 6 6"/>
        </svg>
      </button>
    </form>
    <div class="meta">
      <p class="meta-text"><span id="meta-long" class="meta-long"></span><span id="meta-short" class="meta-short"></span></p>
      <button id="contact-btn" class="link-btn" type="button">Contact Team Alpha</button>
    </div>
  </footer>
</body>
</html>
